name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Single GC thread — the Pkg.test subprocess inherits this and avoids the intermittent
      # Julia 1.12 parallel-GC sweep-race SIGSEGV that otherwise crashes a heavy suite.
      JULIA_NUM_GC_THREADS: "1"
    permissions: # julia-actions/cache proactively deletes old caches it created
      actions: write
      contents: read
    # Spanning two Julias costs one compat range: ReTest 0.3.4 does not precompile on 1.13 (it
    # imports Test.push_testset/pop_testset, which 1.13 removed) and 0.4 is itself gated to 1.13+,
    # so Project.toml lists `ReTest = "0.3.4, 0.4"` and each version resolves the one that works.
    # That note lives here rather than beside the bound, because Pkg rewrites Project.toml on every
    # resolve and drops comments.
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'   # the `slate` app + engine target Julia 1.12, and compat floors there
          - '1.13'   # current release: catch what the next Julia breaks before a user does
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v2
      - name: Add registries
        # Pkg needs SlateExtensionsBase to be registered *somewhere* even when it resolves from a
        # path, so without a registry the develop step below fails with "expected package
        # SlateExtensionsBase to be registered". General carries it.
        #
        # The update also guards against julia-actions/cache restoring a registry snapshot that
        # predates a just-published dependency, which makes resolve fail until the cache expires.
        run: |
          julia -e '
            using Pkg
            regs = [r.name for r in Pkg.Registry.reachable_registries()]
            "General" in regs || Pkg.Registry.add("General")
            Pkg.Registry.update()'
      - name: Use the in-repo SlateExtensionsBase
        # lib/ holds the SDK at this commit — develop it so the suite tests this checkout's
        # source rather than whatever version the registry currently serves.
        # `--project=.` is load-bearing: buildpkg and runtest resolve the project env, so a develop
        # into the default env leaves the suite testing the registry's copy.
        run: julia --project=. -e 'using Pkg; Pkg.develop(path="lib/SlateExtensionsBase")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
