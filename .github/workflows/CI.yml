name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Single GC thread — the Pkg.test subprocess inherits this and avoids the intermittent
      # Julia 1.12 parallel-GC sweep-race SIGSEGV that otherwise crashes a heavy suite.
      JULIA_NUM_GC_THREADS: "1"
    permissions: # julia-actions/cache proactively deletes old caches it created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'   # the `slate` app + engine target Julia 1.12
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v2
      - name: Add registries
        # SlateExtensionsBase is registered in SlateRegistry, not General. Pkg needs the package
        # to be registered *somewhere* even when it resolves from a path, so without this the
        # develop step below fails with "expected package SlateExtensionsBase to be registered".
        #
        # The update also guards against julia-actions/cache restoring a registry snapshot that
        # predates a just-published dependency, which makes resolve fail until the cache expires.
        run: |
          julia -e '
            using Pkg
            regs = [r.name for r in Pkg.Registry.reachable_registries()]
            # Adding a registry by URL into a cold depot does NOT pull in General, so name it too.
            "General" in regs || Pkg.Registry.add("General")
            "SlateRegistry" in regs ||
                Pkg.Registry.add(RegistrySpec(url = "https://github.com/kahliburke/SlateRegistry.git"))
            Pkg.Registry.update()'
      - name: Use the in-repo SlateExtensionsBase
        # lib/ holds the SDK at this commit — develop it so the suite tests this checkout's
        # source rather than whatever version the registry currently serves.
        run: julia -e 'using Pkg; Pkg.develop(path="lib/SlateExtensionsBase")'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
