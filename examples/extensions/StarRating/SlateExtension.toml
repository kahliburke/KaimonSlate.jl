# Catalog listing for the Extensions gallery. EVERY key here is optional — a package with no such
# file is still listed, using its name, version, repo and module docstring. This one is filled in
# because StarRating is the worked example: it shows what the richest tier looks like.
#
# Prose and images are read from the DEFAULT BRANCH, so fixing a description here doesn't need a
# release. Versions always come from the registry.

title    = "Star Rating"
tagline  = "A ★ rating control for @bind — the smallest complete Slate extension"
icon     = "★"
categories = ["controls", "examples"]

# A notebook in this repo that demonstrates the package. Two things use it: the gallery shows an
# "Example notebook" link, and `docs/generate_extension_assets.mjs` runs it headless and photographs
# the page — so a package gets card imagery from a file that's already maintained, and it can't
# drift from the code.
example = "notebooks/stars_demo.jl"

# Generated by that script and HOSTED, not committed — screenshots are regenerated often and a
# package repository is a bad place to accumulate them. This uses the same `docs-assets` release
# this repository already publishes its documentation media to. The catalog build mirrors the image
# into the published artifact, so the release only has to be reachable when the catalog is built.
screenshots = ["https://github.com/kahliburke/KaimonSlate.jl/releases/download/docs-assets/StarRating-notebook.png"]

# What lands in a fresh cell when the user accepts the starter offer after installing. Installing a
# package doesn't make it active; this is what closes that gap.
snippet = """
using StarRating
@bind rating Stars(; max = 5, label = "How good?")
"""

# Written by hand because it names the extension POINTS exercised, which is the useful thing about
# this package. For most extensions the gallery derives this from the running worker instead.
provides = [
    "@bind control: Stars(; max, label) — binds an Int in 0:max",
    "Cell toolbar action: ★ inserts a Stars() snippet",
    "Editor extension: Ctrl-Alt-8 inserts ★ on code cells",
    "Command palette: insert a Stars() control",
]
