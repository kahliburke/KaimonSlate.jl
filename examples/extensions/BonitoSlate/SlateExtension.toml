# Gallery card for BonitoSlate. Lives at the package subdir root, matching the `subdir` the
# registry records. See docs/src/listing-an-extension.md.

title    = "BonitoSlate"
tagline  = "Interactive WGLMakie figures, and Slate controls drawn inside them"
icon     = "🎛"
categories = ["plotting", "controls", "widgets"]

description = """
Brings Bonito.jl — and with it WGLMakie's interactive WebGL figures — into Slate, routed over the
notebook's existing WebSocket rather than a second server or port.

It also closes the gap between a Slate control and a Makie figure. Reading a `@bind` variable makes
a cell a reader, so every change rebuilds the whole figure; `bind_observable(:name)` hands the value
over as an Observable the figure updates from in place instead. `hidden(…)` then lets a control be
drawn wherever it belongs — including as a native widget inside the figure card, via
`bonito_controls` — without a second copy appearing in the notebook.
"""

example = "notebooks/controls.jl"

# With a `video` set this image is used as its POSTER rather than appearing in the strip, so it is
# a frame of the clip below — the two showing different things would be worse than either alone.
# HOSTED, not committed: a binary in the tree churns every time it is regenerated. Upload to the
# docs-assets release, as StarRating does.
screenshots = ["https://github.com/kahliburke/KaimonSlate.jl/releases/download/docs-assets/BonitoSlate-poster.png"]

# Recorded with `node docs/record_extension_demo.mjs --url <served notebook> --cell fig_3d`, which
# drives the controls with a real pointer and films the result — a screenshot cannot show the point
# of this extension, which is that the figure updates in place instead of being rebuilt. Hosted for
# the same reason as the screenshot.
video   = "https://github.com/kahliburke/KaimonSlate.jl/releases/download/docs-assets/BonitoSlate-demo.mp4"
docs    = "https://kahliburke.github.io/KaimonSlate.jl/extensions/"

provides = [
  "Interactive WGLMakie figures over Slate's own transport (no extra port)",
  "bind_observable(:name) — a control as an Observable, so a figure updates in place",
  "hidden(Widget(…)) — a control drawn somewhere other than the notebook",
  "bonito_controls(session, names...) — native Bonito widgets inside the figure card",
  "Bonito.App support, so any Bonito output renders and survives a reload",
]

snippet = """
using WGLMakie, BonitoSlate
WGLMakie.activate!()
BonitoSlate.enable!()
use_slate_theme!()

@bind decay Slider(0.0:0.05:1.5; default = 0.35)

let                                   # never re-runs: `decay` appears only as quoted data
    d = bind_observable(:decay)
    t = range(0, 4π; length = 400)
    fig = Figure(size = (700, 300))
    ax = Axis(fig[1, 1]; xlabel = "t", ylabel = "x(t)")
    lines!(ax, t, lift(v -> @.(exp(-v * t) * sin(4t)), d); linewidth = 3)
    ylims!(ax, -1.1, 1.1)
    fig
end
"""
