# Local Docker SLURM for KaimonSlate batch-fabric development. NOT a production config.
ClusterName=slate
SlurmctldHost=slurmctld
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

# Containers have no usable cgroup hierarchy unless the daemon runs privileged, so track processes
# the old way and skip task confinement. This is the single most common reason a dockerised slurmd
# refuses to start.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# A node that misses a heartbeat during a container pause comes back by itself instead of sitting
# DOWN until someone runs `scontrol update state=resume`.
ReturnToService=2
SlurmctldTimeout=60
SlurmdTimeout=60
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

# Accounting. sacct is deliberately available here so the "why did this shard fail" path can be
# tested, and so we can also test behaving correctly when a site has NOT configured it.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=10

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info

# Two compute nodes, four cores each: eight slots, enough for array parallelism to be visible.
# RealMemory is well under what the container can actually see so slurmd never drains itself.
# Topology is stated explicitly so slurmd does not "reconfigure socket/core boundaries" against
# whatever the container happens to see on the host.
NodeName=c[1-2] CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=4 ThreadsPerCore=1 \
         RealMemory=2048 State=UNKNOWN

# Two partitions so partition-keyed depots and backfill behaviour have something to exercise.
PartitionName=compute Nodes=c[1-2] Default=YES MaxTime=INFINITE State=UP
PartitionName=short   Nodes=c[1-2] MaxTime=00:10:00 State=UP
