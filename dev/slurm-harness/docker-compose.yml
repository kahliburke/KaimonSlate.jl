# Local SLURM cluster for batch-fabric development.
#
#   ./up.sh          bring it up (generates an ssh keypair on first run)
#   ./up.sh --down   tear it down, keeping volumes
#   ./up.sh --clean  tear it down and delete volumes
#
# The login node is the only thing the hub talks to, exactly as with a real cluster: ssh in,
# run sbatch/squeue, read the shared filesystem.

name: slate-slurm

# The image is built once by up.sh. Declaring `build:` on every service here makes compose race
# five concurrent builds against the same tag, which fails with "image already exists".
x-slurm: &slurm
  image: slate-slurm:latest
  volumes:
    # A HOST directory, not a named volume: the hub runs on the Mac and has to see the same CAS the
    # compute nodes write to. That is the shared-filesystem case the design assumes; only the paths
    # differ between the two sides (./scratch here, /scratch in the container).
    - ./scratch:/scratch
    - slatehome:/home/slate
  networks: [slurm]
  restart: unless-stopped

services:
  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: slurmdbpass
    volumes:
      - mysql:/var/lib/mysql
    networks: [slurm]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  slurmdbd:
    <<: *slurm
    hostname: slurmdbd
    command: ["slurmdbd"]
    depends_on:
      mysql:
        condition: service_healthy

  slurmctld:
    <<: *slurm
    hostname: slurmctld
    command: ["slurmctld"]
    depends_on: [slurmdbd]

  # No privileged/cgroup:host needed: CgroupPlugin=disabled (24.x only) stops slurmd creating a
  # slurmstepd systemd scope, which is what fails in a container.
  c1:
    <<: *slurm
    hostname: c1
    command: ["slurmd"]
    depends_on: [slurmctld]

  c2:
    <<: *slurm
    hostname: c2
    command: ["slurmd"]
    depends_on: [slurmctld]

  login:
    <<: *slurm
    hostname: login
    command: ["login"]
    depends_on: [slurmctld]
    ports:
      - "2222:22"
    volumes:
      - ./scratch:/scratch
      - slatehome:/home/slate
      - ./ssh:/ssh:ro

networks:
  slurm:

volumes:
  slatehome:
  mysql:
